<div class="container mt-4">
  <h3 class="mb-3 text-primary">📏 Quản lý kích thước</h3>

  <div class="d-flex justify-content-end mb-2">
    <button class="btn btn-success" (click)="openModal()">➕ Thêm mới</button>
  </div>

  <!-- BẢNG DỮ LIỆU -->
  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Mã kích thước</th>
        <th>Chỉ số kích thước</th>
        <th>Trạng thái</th>
        <th class="text-center">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of sizes">
        <td>{{ s.id }}</td>
        <td>{{ s.maKichThuoc }}</td>
        <td>{{ s.chiSoKichThuoc }}</td>
        <td>{{ s.trangThai ? 'Hoạt Động' : 'Không Hoạt Động' }}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-primary me-1" (click)="editSize(s)">Sửa</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- PHÂN TRANG -->
  <div class="d-flex justify-content-between align-items-center">
    <button class="btn btn-outline-primary" (click)="prevPage()" [disabled]="currentPage === 0">« Trước</button>
    <span>Trang {{ currentPage + 1 }} / {{ totalPages }}</span>
    <button class="btn btn-outline-primary" (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">Sau »</button>
  </div>

  <!-- FORM MODAL -->
  <div class="modal fade show d-block" *ngIf="isModalOpen" tabindex="-1" style="background: rgba(0,0,0,0.5)">
    <div class="modal-dialog">
      <div class="modal-content">
        <form (ngSubmit)="saveSize()">
          <div class="modal-header">
            <h5 class="modal-title">{{ isEditMode ? 'Cập nhật kích thước' : 'Thêm mới kích thước' }}</h5>
            <button type="button" class="btn-close" (click)="closeModal()"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Chỉ số kích thước</label>
              <input type="text" class="form-control" [(ngModel)]="size.chiSoKichThuoc" name="chiSoKichThuoc" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Trạng thái</label>
              <select class="form-select" [(ngModel)]="size.trangThai" name="trangThai" required>
                <option [ngValue]="true">Hoạt động</option>
                <option [ngValue]="false">Không hoạt động</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">
              {{ isEditMode ? 'Cập nhật' : 'Thêm mới' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
